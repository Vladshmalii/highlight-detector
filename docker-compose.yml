version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:pass@db:5432/highlights
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
      - ./videos:/app/videos
    networks:
      - highlight_network

  worker:
    build: .
    command: ["worker"]
    environment:
      - DATABASE_URL=postgresql://user:pass@db:5432/highlights
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
      - ./videos:/app/videos
    networks:
      - highlight_network

  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=highlights
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - highlight_network

  redis:
    image: redis:7-alpine
    networks:
      - highlight_network

volumes:
  postgres_data:

networks:
  highlight_network:
    driver: bridge